<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STT Cipasung - Profil Kampus</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      color: #333333;
    }
    header {
      background-color: #003366;
      color: white;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    nav {
      margin-top: 10px;
    }
    nav a {
      color: #e0e0e0;
      margin-right: 15px;
      text-decoration: none;
    }
    nav a:hover {
      text-decoration: underline;
    }
    main {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 20px;
    }
    .section-title {
      font-size: 24px;
      margin-bottom: 15px;
    }
    img {
      max-width: 100%;
      height: auto;
      margin: 15px 0;
    }
    form p {
      margin-bottom: 10px;
    }
    label {
      display: block;
      margin-bottom: 5px;
    }
    footer {
      text-align: center;
      padding: 15px;
      background-color: #f4f4f4;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <header>
    <h1>STT Cipasung</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">Programs</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main>
    <section>
      <h2 class="section-title">About Us</h2>
      <p>STT Cipasung is a technology college in Tasikmalaya.</p>
      <img src="https://placehold.co/600x300?text=STT+Cipasung" alt="Foto Kampus STT Cipasung">
    </section>

    <section>
      <h2 class="section-title">Contact Us</h2>
      <form action="#" method="post">
        <p>
          <label for="rev-name">Name:</label>
          <input type="text" id="rev-name" name="name" placeholder="Name">
        </p>
        <p>
          <label for="rev-email">Email:</label>
          <input type="email" id="rev-email" name="email" placeholder="Email">
        </p>
        <p>
          <button type="submit">Send</button>
        </p>
      </form>
    </section>
  </main>

  <footer>
    <p>Copyright 2026 STT Cipasung</p>
  </footer>

</body>
</html>
